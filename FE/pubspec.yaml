name: frontend
description: "AI Dream Diary Front-End Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 💡 필수 패키지 3형제 미리 탑재!
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# 💡 2. 아이콘 설정 추가 (파일 맨 아래 빈 공간에 추가)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png" # 방금 넣은 아이콘 파일의 경로와 이름
