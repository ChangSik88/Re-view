name: frontend
description: "AI Dream Diary Front-End Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 💡 필수 패키지 3형제 미리 탑재!
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  flutter_svg: ^2.2.0
  speech_to_text: ^7.5.0
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700

# 💡 2. 아이콘 설정 추가 (파일 맨 아래 빈 공간에 추가)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png" # 방금 넣은 아이콘 파일의 경로와 이름
