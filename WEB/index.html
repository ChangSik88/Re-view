<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Re-view — 오늘의 꿈 해몽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="home.css" />
</head>
<body class="home stage-input">
  <main class="stage">
    <div class="sky" aria-hidden="true"></div>

    <header class="topbar">
      <a href="index.html" class="logo">굿모닝 드림</a>
      <p id="remaining" class="remaining" hidden>
        <span class="remaining-dot" aria-hidden="true"></span>
        <span><span class="remaining-long">오늘 </span>남은 해몽 <span id="remaining-count"></span>회</span>
      </p>
    </header>

    <div class="hero">
      <p class="hero-sub">좋은 아침이에요</p>
      <h1 class="hero-title">오늘 아침,<br />어떤 <em>꿈</em>을 꾸셨나요?</h1>
    </div>

    <form id="interpret-form" class="dream-form">
      <div class="dream-pill">
        <input id="dream-input" type="text" maxlength="500" autocomplete="off" aria-label="간밤에 꾼 꿈" placeholder="간밤에 꾼 꿈을 한 줄로 적어보세요" />
        <button type="submit" id="submit-btn" aria-label="해몽 받기">
          <span class="btn-label">해몽 받기</span><span class="btn-arrow" aria-hidden="true">→</span>
        </button>
      </div>
      <p id="input-error" class="error-message" hidden></p>
    </form>

    <section id="home-ranking" class="preview" hidden>
      <div class="preview-head">
        <span class="preview-label"><span class="preview-label-long">오늘 아침 </span>많이 찾는 꿈</span>
        <a href="ranking.html" class="ranking-link">전체보기 →</a>
      </div>
      <ol id="home-ranking-list" class="preview-list"></ol>
    </section>

    <!-- 카드는 단계마다 지평선을 넘나들며 움직이므로 문서 흐름 밖에 둔다. 클릭은 B5(reveal)에서만 받아 결과로 넘긴다. -->
    <button type="button" id="tarot-card" class="tarot-card" aria-label="카드를 눌러 해몽 보기" disabled>
      <span class="card-inner">
        <span class="face face-back" aria-hidden="true">
          <span class="emblem"><span></span></span>
          <span class="face-back-label">GOODMORNING DREAM</span>
        </span>
        <span class="face face-front">
          <span id="card-art" class="card-art"></span>
          <span id="card-title" class="card-title"></span>
        </span>
      </span>
    </button>
    <p id="stage-caption" class="stage-caption" aria-live="polite"></p>

    <article id="result" class="result">
      <h2 id="result-tag" class="result-tag"></h2>
      <p id="result-summary" class="result-summary"></p>
      <div class="result-more">
        <hr class="result-rule" />
        <div id="result-details" class="result-details"></div>
        <div class="result-actions">
          <button type="button" id="share-btn" class="btn-ghost">공유</button>
          <button type="button" id="retry-btn" class="btn-fill">다시 해보기</button>
        </div>
      </div>
    </article>
  </main>

  <div id="exhausted-modal" class="modal" hidden>
    <div class="modal-content">
      <p id="exhausted-message">앱에서 더 해보세요! 앱 설치 시 추가 기회를 무료로 드려요.</p>
      <div class="modal-actions">
        <button type="button" id="modal-close" class="btn-ghost">닫기</button>
        <a href="#" id="app-store-link" class="btn-fill">앱 설치하러 가기</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
